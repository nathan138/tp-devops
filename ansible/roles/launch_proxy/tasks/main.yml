---
- name: Run HTTPD
  community.docker.docker_container:
    name: httpd
    image: nathank04/tp-devops-httpd:latest
    pull: true
    ports:
      - "80:80"
    networks:
      - name: front-network
    restart_policy: unless-stopped
  vars:
    ansible_python_interpreter: /opt/docker_venv/bin/python3
