name: CI devops 2025
on:
  # lance le pipeline a chaque push sur ces branches
  push:
    branches: [ master, develop ]
  # et a chaque pull request
  pull_request:

jobs:
  test-backend:
    # machine virtuelle Linux fournie par GitHub
    runs-on: ubuntu-24.04
    steps:
      # recupere le code du repo dans la machine
      - uses: actions/checkout@v4

      # installe Java 21 (distribution Temurin, la meme que dans les Dockerfiles)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # compile et lance les tests unitaires + integration (Testcontainers lance PostgreSQL)
      - name: Build and test with Maven
        run: mvn clean verify --file tp1/backend/simple-api/pom.xml

      # analyse la qualite du code avec SonarCloud (bugs, failles, duplications, couverture JaCoCo)
      # le token est lu dans les secrets GitHub, jamais ecrit en clair
      # plugin appele par son nom complet : le raccourci "sonar:sonar" n'est pas reconnu par Maven ici
      - name: SonarCloud analysis
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar -Dsonar.projectKey=nathan138_tp-devops -Dsonar.organization=nathan138 -Dsonar.host.url=https://sonarcloud.io -Dsonar.token=${{ secrets.SONAR_TOKEN }} --file ./tp1/backend/simple-api/pom.xml

  # construit les 3 images Docker et les publie sur Docker Hub
  build-and-push-docker-image:
    # attend que le job test-backend soit vert avant de demarrer
    needs: test-backend
    runs-on: ubuntu-24.04
    steps:
      # chaque job a sa propre VM : il faut refaire le checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # connexion a Docker Hub avec les secrets GitHub (token passe par stdin, jamais en clair)
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      # image du backend (Dockerfile multistage du TP1)
      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          # dossier qui contient le Dockerfile
          context: ./tp1/backend/simple-api
          # le tag doit etre en minuscules
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest
          # build sur toutes les branches, publie seulement depuis master
          push: ${{ github.ref == 'refs/heads/master' }}

      # image de la base PostgreSQL
      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./tp1/database
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest
          push: ${{ github.ref == 'refs/heads/master' }}

      # image du reverse proxy httpd
      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./tp1/http-server
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest
          push: ${{ github.ref == 'refs/heads/master' }}

  # deploie les nouvelles images sur le serveur avec le playbook Ansible
  deploy:
    # attend que les images soient publiees sur Docker Hub
    needs: build-and-push-docker-image
    # les images ne sont publiees que depuis master : on ne deploie que depuis master
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # memes versions qu'en local : community.docker 3.x (fourni avec ansible-core 2.16)
      # est incompatible avec la lib requests recente du venv docker du serveur
      - name: Install Ansible
        run: |
          # --force : le runner a deja une autre version d'ansible-core preinstallee
          pipx install --force "ansible-core==2.16.*"
          ansible-galaxy collection install "community.docker:>=4.0.0,<5.0.0"

      # la cle privee vient des secrets GitHub, jamais du repo
      # ssh-keyscan enregistre l'empreinte du serveur pour eviter la question "yes/no" de SSH
      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          # tr -d '\r' : une cle copiee depuis Windows contient des fins de ligne CRLF que SSH refuse
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H nathan.klieber.takima.school >> ~/.ssh/known_hosts

      # -e surcharge le chemin de la cle de l'inventaire (celui de WSL n'existe pas ici)
      # et fournit le mot de passe BDD, absent du repo
      - name: Deploy with Ansible
        working-directory: ./ansible
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: >
          ansible-playbook -i inventories/setup.yml playbook.yml
          -e ansible_ssh_private_key_file=$HOME/.ssh/id_rsa
          -e "postgres_password=$POSTGRES_PASSWORD"
